<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Configuration de base et encodage -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Portfolio Dark John</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="Image/Dark.jpg" />
    
    <style>
        /* ============================================
           VARIABLES CSS - THÈME ET TRANSITIONS
           ============================================ */
        :root {
            --bg: #0b0b12;               /* Fond sombre principal */
            --muted: #aeb0c0;            /* Couleur texte secondaire (gris) */
            --accent1: #ff4fc0;          /* Rose - accent principal */
            --accent2: #7f5fff;          /* Violet - accent secondaire */
            --glass: rgba(255, 255, 255, 0.03); /* Effet verre glacé */
            --radius: 20px;              /* Coins arrondis standard */
            --transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Animation fluide */
        }

        /* ============================================
           RÉINITIALISATION GLOBALE
           ============================================ */
        * { 
            box-sizing: border-box;  /* Inclure padding et border dans la taille */
            font-family: 'Poppins', sans-serif; /* Police Google Fonts */
            margin: 0; 
            padding: 0; 
        }
        
        /* Animation d'apparition au chargement : remontée + fade in */
        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(30px); /* Commence transparent et bas */
            } 
            to { 
                opacity: 1; 
                transform: translateY(0); /* Finit visible et à sa place */
            }      
        }

        /* ============================================
           STYLES DU CORPS
           ============================================ */
        body { 
            background: var(--bg);       /* Fond sombre */
            color: #fff;                /* Texte blanc */
            line-height: 1.6;           /* Espacement vertical du texte */
            overflow-x: hidden;         /* Cache les débordements horizontaux */
        }

        /* ============================================
           HEADER - BARRE DE NAVIGATION FIXÉE
           ============================================ */
        header {
            position: sticky;             /* Reste visible au scrolling */
            top: 0; 
            z-index: 1000;                /* Au-dessus du contenu */
            background: rgba(11, 11, 18, 0.9); /* Fond semi-transparent */
            backdrop-filter: blur(15px);  /* Effet verre floue */
            padding: 15px 5%;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); /* Bordure subtile */
        }
        
        /* Logo et marque du site */
        .brand { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            text-decoration: none; 
            color: #fff; 
        }
        
        /* Image du logo circulaire */
        .logo-img { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%;           /* Forme circulaire */
            border: 2px solid var(--accent2); /* Bordure violette */
            object-fit: cover; 
        }
        
        /* Menu de navigation */
        nav ul { 
            display: flex; 
            gap: 25px; 
            list-style: none;            /* Enlever les puces */
        }
        
        /* Lien de navigation */
        nav a { 
            color: var(--muted);         /* Couleur grise par défaut */
            text-decoration: none; 
            font-weight: 500; 
            transition: 0.3s;            /* Lisse la transition */
        }
        
        /* Lien actif et au survol */
        nav a:hover, nav a.active { 
            color: var(--accent1);       /* Change en rose */
        }

        /* ============================================
           CONTENEUR PRINCIPAL
           ============================================ */
        .container { 
            max-width: 1000px;           /* Limite la largeur */
            margin: 60px auto;           /* Centre et ajoute espacement vertical */
            padding: 0 20px;             /* Espacement horizontal responsive */
            animation: fadeInUp 0.8s ease-out forwards; /* Animation d'apparition smooth */
        }
        
        /* ============================================
           GRILLE DE CONTACT (INFOS + FORMULAIRE)
           ============================================ */
        .contact-grid { 
            display: grid;               /* Utilise CSS Grid pour layout */
            grid-template-columns: 1fr 1.5fr;  /* Colonne infos (petite) + formulaire (grande) */
            gap: 40px;                   /* Espacement entre les colonnes */
            perspective: 1000px;         /* Ajoute profondeur pour les effets 3D */
        }

        /* ============================================
           CARTES AVEC EFFET 3D
           ============================================ */
        .info-card, .form-card { 
            background: var(--glass);    /* Fond semi-transparent (verre) */
            padding: 40px;               /* Espacement interne */
            border-radius: var(--radius);  /* Coins arrondis */
            border: 1px solid rgba(255,255,255,0.05); /* Bordure subtile */
            transition: var(--transition); /* Animation fluide */
            backdrop-filter: blur(5px);   /* Effet flou derrière */
            position: relative;           /* Pour les pseudo-éléments */
        }

        /* Effet de lévitation + rotation 3D + lueur au survol */
        .info-card:hover, .form-card:hover {
            transform: translateY(-10px) rotateX(2deg) rotateY(-2deg); /* Remonte + légère rotation 3D */
            background: rgba(255, 255, 255, 0.05); /* Devient un peu plus visible */
            border-color: var(--accent2);  /* Bordure violette */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 20px rgba(127, 95, 255, 0.1); /* Ombre + lueur violette */
        }

        /* Titre principal de la carte infos */
        .info-card h1 { 
            font-size: 2.5rem; 
            margin-bottom: 20px; 
            color: var(--accent2);       /* Violet */
        }

        /* ============================================
           GRILLE DES RÉSEAUX SOCIAUX
           ============================================ */
        .social-grid { 
            display: flex; 
            gap: 12px;                   /* Espacement entre les icônes */
            flex-wrap: wrap;             /* Wrap si pas assez de place */
            margin-top: 15px; 
        }
        
        /* Chaque icône/bouton réseau social */
        .social-box {
            width: 48px; 
            height: 48px;
            background: rgba(255,255,255,0.05); /* Fond semi-transparent */
            border-radius: 12px;         /* Coins légèrement arrondis */
            display: flex; 
            align-items: center; 
            justify-content: center;     /* Icône centrée */
            transition: var(--transition); /* Animation fluide */
            border: 1px solid rgba(255,255,255,0.1); /* Bordure subtile */
        }
        
        /* Effet au survol : couleur + remontée + zoom */
        .social-box:hover { 
            background: var(--accent2);  /* Fond violet */
            transform: translateY(-5px) scale(1.1);  /* Remonte et grossit */
            box-shadow: 0 10px 20px rgba(127, 95, 255, 0.3); /* Lueur violette */
        }
        
        /* SVG de l'icône */
        .social-box svg { 
            width: 22px; 
            height: 22px; 
            fill: #fff;                 /* Icône blanche */
        }

        /* ============================================
           FORMULAIRE INTERACTIF
           ============================================ */
        
        /* Champs input et textarea */
        input, textarea {
            width: 100%;                 /* Largeur complète */
            background: rgba(0,0,0,0.3); /* Fond sombre semi-transparent */
            border: 1px solid rgba(255,255,255,0.1); /* Bordure subtile */
            padding: 15px; 
            border-radius: 12px;         /* Coins arrondis */
            color: #fff;                 /* Texte blanc */
            margin-bottom: 20px;         /* Espacement entre champs */
            outline: none;               /* Enlever outline par défaut */
            transition: all 0.3s ease;   /* Animation smooth */
        }

        /* Style au focus (quand l'utilisateur clique) */
        input:focus, textarea:focus { 
            border-color: var(--accent1);  /* Bordure rose */
            background: rgba(255, 255, 255, 0.05); /* Fond plus visible */
            box-shadow: 0 0 15px rgba(255, 79, 192, 0.2); /* Lueur rose */
            transform: scale(1.01);        /* Léger zoom */
        }

        /* ============================================
           BOUTON D'ENVOI
           ============================================ */
        .btn-send {
            width: 100%;                 /* Largeur complète */
            padding: 16px;               /* Padding interne */
            border-radius: 12px;         /* Coins arrondis */
            border: none;                /* Pas de bordure */
            background: linear-gradient(90deg, var(--accent1), var(--accent2)); /* Dégradé rose-violet */
            color: #fff; 
            font-weight: 700;            /* Texte gras */
            cursor: pointer;             /* Curseur pointeur */
            transition: var(--transition); /* Animation fluide */
            position: relative;          /* Pour l'effet ::after */
            overflow: hidden;            /* Cache l'effet ::after qui dépasse */
        }

        /* Effet au survol : zoom + ombre */
        .btn-send:hover { 
            transform: scale(1.05);      /* Grossit de 5% */
            box-shadow: 0 10px 25px rgba(127, 95, 255, 0.4); /* Ombre violette */
        }

        /* ============================================
           EFFET REFLET SUR LE BOUTON (::after)
           ============================================ */
        /* Pseudo-élément créant un reflet qui traverse le bouton */
        .btn-send::after {
            content: '';                 /* Pseudo-élément invisible */
            position: absolute;          /* Positionné au-dessus du bouton */
            top: -50%; 
            left: -100%;                 /* Commence hors de l'écran */
            width: 50%; 
            height: 200%;
            background: rgba(255,255,255,0.2); /* Reflet blanc semi-transparent */
            transform: rotate(30deg);    /* Angle du reflet */
            transition: 0.6s;            /* Mouvement lent */
        }
        
        /* Au survol, le reflet traverse de gauche à droite */
        .btn-send:hover::after { 
            left: 150%;                  /* Reflet sort de l'écran à droite */
        }

        /* ============================================
           RESPONSIVE DESIGN - PETITS ÉCRANS
           ============================================ */
        @media (max-width: 800px) { 
            /* Sur mobile, la grille passe à 1 colonne */
            .contact-grid { 
                grid-template-columns: 1fr; 
            } 
        }
    </style>
</head>
